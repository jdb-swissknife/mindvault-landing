<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Birthday Mia!</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.11.3/p5.min.js"></script>
  <style>
    html, body { margin: 0; padding: 0; overflow: hidden; background: #0a0a0f; }
    canvas { display: block; }
  </style>
</head>
<body>
<script>
p5.disableFriendlyErrors = true;

const PALETTE = {
  neonPink: '#FF2D78',
  neonBlue: '#00D4FF',
  neonPurple: '#B44AFF',
  neonYellow: '#FFE44D',
  neonOrange: '#FF6B35',
  neonGreen: '#39FF14',
  white: '#FFFFFF',
  softPink: '#FFB6C1',
};

let confetti = [];
let stars = [];
let cats = [];
let sparkles = [];
let heartParticles = [];
let t = 0;
let scene = 0;
let sceneTimer = 0;
let fadeAlpha = 255;

const SCENE_INTRO = 0;
const SCENE_CATS = 1;
const SCENE_MESSAGE = 2;
const SCENE_SAMBAL = 3;
const SCENE_FINALE = 4;
const TOTAL_SCENES = 5;

function setup() {
  createCanvas(windowWidth, windowHeight);
  pixelDensity(1);
  textFont('Arial');
  
  // Init stars
  for (let i = 0; i < 80; i++) {
    stars.push({
      x: random(width),
      y: random(height),
      size: random(1, 3),
      twinkle: random(TWO_PI),
      speed: random(0.02, 0.06)
    });
  }
  
  // Init confetti
  for (let i = 0; i < 120; i++) {
    confetti.push(makeConfetti());
  }
  
  // Init cats at different positions
  cats.push({ x: width * 0.18, y: height * 0.58, size: 80, color: '#FF9834', phase: 0, type: 'orange' });
  cats.push({ x: width * 0.5, y: height * 0.55, size: 90, color: '#333333', phase: 1, type: 'black' });
  cats.push({ x: width * 0.82, y: height * 0.58, size: 75, color: '#F5F5F5', phase: 2, type: 'white' });
  cats.push({ x: width * 0.35, y: height * 0.7, size: 60, color: '#888888', phase: 3, type: 'grey' });
  cats.push({ x: width * 0.65, y: height * 0.72, size: 65, color: '#C47A2B', phase: 4, type: 'tabby' });
}

function makeConfetti() {
  const colors = [PALETTE.neonPink, PALETTE.neonBlue, PALETTE.neonPurple, PALETTE.neonYellow, PALETTE.neonOrange, PALETTE.neonGreen, PALETTE.softPink];
  return {
    x: random(width),
    y: random(-height, 0),
    vx: random(-1, 1),
    vy: random(1.5, 4),
    size: random(4, 10),
    rotation: random(TWO_PI),
    rotSpeed: random(-0.1, 0.1),
    color: random(colors),
    shape: floor(random(3)) // 0=rect, 1=circle, 2=star
  };
}

function draw() {
  t += 0.016;
  sceneTimer += 0.016;
  
  // Scene transitions
  if (sceneTimer > 4 && scene < SCENE_FINALE) {
    sceneTimer = 0;
    scene++;
  }
  
  // Background gradient
  drawBackground();
  
  // Stars
  drawStars();
  
  // Confetti (always falling)
  drawConfetti();
  
  // Scene-specific content
  if (scene >= SCENE_CATS) {
    drawCats();
  }
  
  if (scene >= SCENE_MESSAGE) {
    drawMessage();
  }
  
  if (scene >= SCENE_SAMBAL) {
    drawSambalMessage();
  }
  
  if (scene >= SCENE_FINALE) {
    drawFinale();
  }
  
  // K-Pop sparkle effects
  drawSparkles();
  
  // Heart particles
  drawHearts();
  
  // Border glow
  drawBorderGlow();
}

function drawBackground() {
  // Animated gradient background
  for (let y = 0; y < height; y += 4) {
    let inter = map(y, 0, height, 0, 1);
    let c1 = color(15, 5, 40);
    let c2 = color(40, 5, 60);
    let c3 = color(10, 10, 35);
    let c;
    if (inter < 0.5) {
      c = lerpColor(c1, c2, inter * 2 + sin(t) * 0.1);
    } else {
      c = lerpColor(c2, c3, (inter - 0.5) * 2 + cos(t) * 0.1);
    }
    stroke(c);
    strokeWeight(4);
    line(0, y, width, y);
  }
  noStroke();
}

function drawStars() {
  for (let s of stars) {
    s.twinkle += s.speed;
    let alpha = map(sin(s.twinkle), -1, 1, 100, 255);
    fill(255, 255, 255, alpha);
    noStroke();
    ellipse(s.x, s.y, s.size);
  }
}

function drawConfetti() {
  for (let c of confetti) {
    c.y += c.vy;
    c.x += c.vx + sin(t * 2 + c.rotation) * 0.5;
    c.rotation += c.rotSpeed;
    
    if (c.y > height + 20) {
      c.y = random(-50, -10);
      c.x = random(width);
    }
    
    push();
    translate(c.x, c.y);
    rotate(c.rotation);
    fill(c.color);
    noStroke();
    if (c.shape === 0) {
      rect(-c.size / 2, -c.size / 4, c.size, c.size / 2);
    } else if (c.shape === 1) {
      ellipse(0, 0, c.size * 0.7);
    } else {
      drawStar5(0, 0, c.size * 0.3, c.size * 0.6);
    }
    pop();
  }
}

function drawStar5(x, y, r1, r2) {
  beginShape();
  for (let i = 0; i < 10; i++) {
    let angle = TWO_PI / 10 * i - HALF_PI;
    let r = (i % 2 === 0) ? r2 : r1;
    vertex(x + cos(angle) * r, y + sin(angle) * r);
  }
  endShape(CLOSE);
}

function drawCats() {
  for (let i = 0; i < cats.length; i++) {
    let cat = cats[i];
    let bounce = sin(t * 3 + cat.phase) * 8;
    let tailWag = sin(t * 4 + cat.phase * 2) * 0.3;
    let appearDelay = (scene >= SCENE_CATS) ? i * 0.5 : 0;
    let appear = constrain((sceneTimer - appearDelay) * 2, 0, 1);
    
    if (appear <= 0) continue;
    
    push();
    translate(cat.x, cat.y + bounce);
    scale(appear);
    
    // Glow behind cat
    let glowSize = cat.size * 2;
    let glowColor = color(255, 45, 120, 30 + sin(t * 2 + i) * 20);
    fill(glowColor);
    noStroke();
    ellipse(0, -cat.size * 0.3, glowSize, glowSize);
    
    drawCat(0, 0, cat.size, cat.color, cat.type, tailWag, i);
    pop();
  }
}

function drawCat(x, y, s, bodyColor, type, tailWag, idx) {
  push();
  translate(x, y);
  
  let bc = color(bodyColor);
  
  // Tail
  noFill();
  stroke(bc);
  strokeWeight(s * 0.12);
  let tailBaseX = s * 0.5;
  let tailBaseY = -s * 0.1;
  beginShape();
  curveVertex(tailBaseX, tailBaseY);
  curveVertex(tailBaseX, tailBaseY);
  curveVertex(tailBaseX + s * 0.3, tailBaseY - s * 0.3 + sin(tailWag) * s * 0.15);
  curveVertex(tailBaseX + s * 0.5, tailBaseY - s * 0.6 + sin(tailWag) * s * 0.25);
  curveVertex(tailBaseX + s * 0.4, tailBaseY - s * 0.8 + sin(tailWag) * s * 0.2);
  endShape();
  
  noStroke();
  
  // Body
  fill(bc);
  ellipse(0, 0, s * 0.9, s * 0.7);
  
  // Head
  ellipse(0, -s * 0.45, s * 0.7, s * 0.6);
  
  // Ears
  fill(bc);
  triangle(-s * 0.25, -s * 0.65, -s * 0.35, -s * 0.95, -s * 0.05, -s * 0.7);
  triangle(s * 0.25, -s * 0.65, s * 0.35, -s * 0.95, s * 0.05, -s * 0.7);
  
  // Inner ears (pink)
  fill(255, 182, 193, 180);
  triangle(-s * 0.22, -s * 0.68, -s * 0.3, -s * 0.88, -s * 0.08, -s * 0.7);
  triangle(s * 0.22, -s * 0.68, s * 0.3, -s * 0.88, s * 0.08, -s * 0.7);
  
  // Tabby stripes
  if (type === 'tabby' || type === 'orange') {
    stroke(color(139, 90, 30, 100));
    strokeWeight(s * 0.03);
    for (let i = 0; i < 3; i++) {
      let stripeY = -s * 0.45 + i * s * 0.05;
      line(-s * 0.12 + i * s * 0.02, stripeY - s * 0.05, s * 0.12 - i * s * 0.02, stripeY - s * 0.05);
    }
    noStroke();
  }
  
  // Eyes - K-Pop style sparkly!
  let blink = (sin(t * 5 + idx * 1.7) > 0.95) ? 0.1 : 1;
  
  // Eye whites
  fill(255);
  ellipse(-s * 0.12, -s * 0.48, s * 0.18, s * 0.2 * blink);
  ellipse(s * 0.12, -s * 0.48, s * 0.18, s * 0.2 * blink);
  
  // Irises - big K-Pop eyes!
  if (blink > 0.5) {
    let eyeColors = [color('#00D4FF'), color('#B44AFF'), color('#39FF14'), color('#FF2D78'), color('#FFE44D')];
    fill(eyeColors[idx % eyeColors.length]);
    ellipse(-s * 0.12, -s * 0.48, s * 0.13, s * 0.15);
    ellipse(s * 0.12, -s * 0.48, s * 0.13, s * 0.15);
    
    // Pupils
    fill(0);
    ellipse(-s * 0.12, -s * 0.48, s * 0.07, s * 0.09);
    ellipse(s * 0.12, -s * 0.48, s * 0.07, s * 0.09);
    
    // Eye sparkle (K-Pop style!)
    fill(255, 255, 255, 230);
    ellipse(-s * 0.09, -s * 0.51, s * 0.04);
    ellipse(s * 0.15, -s * 0.51, s * 0.03);
    
    // Second smaller sparkle
    fill(255, 255, 255, 180);
    ellipse(-s * 0.14, -s * 0.45, s * 0.02);
    ellipse(s * 0.1, -s * 0.45, s * 0.02);
  }
  
  // Nose
  fill(255, 150, 150);
  triangle(-s * 0.03, -s * 0.38, s * 0.03, -s * 0.38, 0, -s * 0.34);
  
  // Mouth
  noFill();
  stroke(100, 100, 100);
  strokeWeight(s * 0.02);
  arc(-s * 0.03, -s * 0.32, s * 0.08, s * 0.06, 0, PI);
  arc(s * 0.03, -s * 0.32, s * 0.08, s * 0.06, 0, PI);
  noStroke();
  
  // Whiskers
  stroke(200, 200, 200, 150);
  strokeWeight(s * 0.01);
  // Left
  line(-s * 0.15, -s * 0.37, -s * 0.4, -s * 0.42);
  line(-s * 0.15, -s * 0.35, -s * 0.4, -s * 0.35);
  line(-s * 0.15, -s * 0.33, -s * 0.4, -s * 0.28);
  // Right
  line(s * 0.15, -s * 0.37, s * 0.4, -s * 0.42);
  line(s * 0.15, -s * 0.35, s * 0.4, -s * 0.35);
  line(s * 0.15, -s * 0.33, s * 0.4, -s * 0.28);
  noStroke();
  
  // Party hat on one cat
  if (idx === 1) {
    let hatBob = sin(t * 2) * 3;
    fill(PALETTE.neonPink);
    triangle(-s * 0.15, -s * 0.88, s * 0.15, -s * 0.88, 0, -s * 1.3 + hatBob);
    fill(PALETTE.neonYellow);
    triangle(-s * 0.08, -s * 0.88, s * 0.08, -s * 0.88, 0, -s * 1.3 + hatBob);
    // Pompom
    fill(PALETTE.neonBlue);
    ellipse(0, -s * 1.32 + hatBob, s * 0.1);
    // Stripes
    fill(PALETTE.neonPurple);
    rect(-s * 0.06, -s * 1.0 + hatBob, s * 0.12, s * 0.04);
    fill(PALETTE.neonGreen);
    rect(-s * 0.09, -s * 1.1 + hatBob, s * 0.18, s * 0.04);
  }
  
  // Paws
  fill(bc);
  ellipse(-s * 0.2, s * 0.25, s * 0.18, s * 0.1);
  ellipse(s * 0.2, s * 0.25, s * 0.18, s * 0.1);
  
  // Toe beans!
  fill(255, 170, 170, 150);
  for (let j = 0; j < 3; j++) {
    ellipse(-s * 0.25 + j * s * 0.06, s * 0.25, s * 0.035);
    ellipse(s * 0.15 + j * s * 0.06, s * 0.25, s * 0.035);
  }
  
  pop();
}

function drawMessage() {
  let appear = constrain((sceneTimer) * 2, 0, 1);
  
  push();
  textAlign(CENTER, CENTER);
  
  // "HAPPY BIRTHDAY" with K-Pop rainbow effect
  let titleSize = min(width * 0.08, 72);
  textSize(titleSize);
  textStyle(BOLD);
  
  let titleText = "HAPPY BIRTHDAY";
  let titleY = height * 0.12;
  
  // Text shadow/glow
  for (let g = 3; g > 0; g--) {
    let glowAlpha = map(g, 3, 0, 20, 60);
    fill(255, 45, 120, glowAlpha * appear);
    text(titleText, width / 2, titleY + g);
    text(titleText, width / 2, titleY - g);
  }
  
  // Rainbow letter coloring
  let colors = [color('#FF2D78'), color('#FF6B35'), color('#FFE44D'), color('#39FF14'), color('#00D4FF'), color('#B44AFF')];
  let totalW = textWidth(titleText);
  let startX = width / 2 - totalW / 2;
  let letterIdx = 0;
  
  for (let i = 0; i < titleText.length; i++) {
    let letter = titleText[i];
    let letterW = textWidth(letter);
    let c = colors[letterIdx % colors.length];
    
    // Wave effect
    let wave = sin(t * 3 + i * 0.3) * 5 * appear;
    
    fill(red(c), green(c), blue(c), 255 * appear);
    text(letter, startX + letterW / 2, titleY + wave);
    startX += letterW;
    if (letter !== ' ') letterIdx++;
  }
  
  // "MIA!" - big and sparkly
  let miaSize = min(width * 0.14, 120);
  textSize(miaSize);
  
  // Glow
  fill(255, 45, 120, 40 * appear);
  for (let g = 5; g > 0; g--) {
    text("MIA!", width / 2 + sin(t * 2) * 3, height * 0.23 + g);
    text("MIA!", width / 2 + sin(t * 2) * 3, height * 0.23 - g);
  }
  
  fill(255, 255, 255, 255 * appear);
  text("MIA!", width / 2 + sin(t * 2) * 3, height * 0.23);
  
  // Heart emojis around MIA
  textSize(miaSize * 0.4);
  fill(255, 45, 120, 200 * appear);
  let hx1 = width / 2 - miaSize * 1.5 + sin(t * 2) * 10;
  let hx2 = width / 2 + miaSize * 1.5 + cos(t * 2) * 10;
  text("\u2764", hx1, height * 0.23 + cos(t * 3) * 5);
  text("\u2764", hx2, height * 0.23 + sin(t * 3) * 5);
  
  pop();
}

function drawSambalMessage() {
  let appear = constrain((sceneTimer) * 1.5, 0, 1);
  
  push();
  textAlign(CENTER, CENTER);
  
  // "We miss you!" 
  let msgSize = min(width * 0.05, 40);
  textSize(msgSize);
  textStyle(BOLD);
  
  let msgY = height * 0.82;
  
  fill(255, 255, 255, 255 * appear);
  text("We miss you!", width / 2, msgY);
  
  // "From Mom, Dad & Winston"
  textSize(msgSize * 0.75);
  textStyle(NORMAL);
  fill(255, 230, 150, 255 * appear);
  text("Love from Mom, Dad & Winston", width / 2, msgY + msgSize * 1.2);
  
  // "Have a Sambal Birthday!" - spicy!!
  let sambalSize = min(width * 0.04, 32);
  textSize(sambalSize);
  textStyle(BOLD);
  
  let sambalY = msgY + msgSize * 2.5;
  let pulse = 1 + sin(t * 4) * 0.05;
  
  push();
  translate(width / 2, sambalY);
  scale(pulse);
  
  // Spicy glow
  fill(255, 107, 53, 60 * appear);
  text("Have a Sambal Birthday!", 0, 0);
  text("Have a Sambal Birthday!", 0, 2);
  text("Have a Sambal Birthday!", 0, -2);
  
  // Chili color gradient
  fill(255, 80, 30, 255 * appear);
  text("Have a Sambal Birthday! \uD83C\uDF36\uFE0F", 0, 0);
  pop();
  
  pop();
}

function drawFinale() {
  // Extra sparkles burst
  if (frameCount % 5 === 0) {
    for (let i = 0; i < 3; i++) {
      sparkles.push({
        x: random(width),
        y: random(height * 0.1, height * 0.5),
        size: random(3, 8),
        life: 1,
        decay: random(0.01, 0.03),
        color: random([PALETTE.neonPink, PALETTE.neonBlue, PALETTE.neonYellow, PALETTE.neonPurple])
      });
    }
  }
  
  // Heart particles floating up
  if (frameCount % 15 === 0) {
    heartParticles.push({
      x: random(width * 0.2, width * 0.8),
      y: height + 20,
      vy: random(-2, -0.5),
      vx: random(-0.5, 0.5),
      size: random(10, 25),
      life: 1,
      decay: random(0.005, 0.015),
      color: random([PALETTE.neonPink, PALETTE.softPink, PALETTE.neonPurple])
    });
  }
}

function drawSparkles() {
  // Ambient sparkles
  if (frameCount % 8 === 0) {
    sparkles.push({
      x: random(width),
      y: random(height),
      size: random(2, 6),
      life: 1,
      decay: random(0.02, 0.04),
      color: random([PALETTE.neonPink, PALETTE.neonBlue, PALETTE.neonYellow, PALETTE.neonPurple, PALETTE.neonGreen])
    });
  }
  
  for (let i = sparkles.length - 1; i >= 0; i--) {
    let s = sparkles[i];
    s.life -= s.decay;
    if (s.life <= 0) {
      sparkles.splice(i, 1);
      continue;
    }
    
    let c = color(s.color);
    fill(red(c), green(c), blue(c), 255 * s.life);
    noStroke();
    
    // 4-point sparkle
    push();
    translate(s.x, s.y);
    rotate(t * 2);
    rect(-s.size * s.life / 2, -0.5, s.size * s.life, 1);
    rect(-0.5, -s.size * s.life / 2, 1, s.size * s.life);
    pop();
  }
}

function drawHearts() {
  for (let i = heartParticles.length - 1; i >= 0; i--) {
    let h = heartParticles[i];
    h.y += h.vy;
    h.x += h.vx + sin(t + i) * 0.3;
    h.life -= h.decay;
    
    if (h.life <= 0) {
      heartParticles.splice(i, 1);
      continue;
    }
    
    let c = color(h.color);
    fill(red(c), green(c), blue(c), 200 * h.life);
    noStroke();
    
    drawHeart(h.x, h.y, h.size * h.life);
  }
}

function drawHeart(x, y, s) {
  push();
  translate(x, y);
  beginShape();
  vertex(0, -s * 0.2);
  bezierVertex(-s * 0.5, -s * 0.7, -s, -s * 0.1, 0, s * 0.4);
  vertex(0, s * 0.4);
  bezierVertex(s, -s * 0.1, s * 0.5, -s * 0.7, 0, -s * 0.2);
  endShape(CLOSE);
  pop();
}

function drawBorderGlow() {
  // Neon border pulses
  noFill();
  strokeWeight(3);
  
  let pulseAlpha = map(sin(t * 2), -1, 1, 30, 100);
  
  // Pink border
  stroke(255, 45, 120, pulseAlpha);
  rect(5, 5, width - 10, height - 10, 10);
  
  // Blue border
  stroke(0, 212, 255, pulseAlpha * 0.7);
  rect(10, 10, width - 20, height - 20, 8);
  
  noStroke();
  
  // Corner sparkles
  let corners = [[20, 20], [width - 20, 20], [20, height - 20], [width - 20, height - 20]];
  for (let i = 0; i < corners.length; i++) {
    let cx = corners[i][0];
    let cy = corners[i][1];
    let s = 5 + sin(t * 3 + i * HALF_PI) * 3;
    
    fill(255, 255, 255, 150 + sin(t * 3 + i) * 50);
    ellipse(cx, cy, s);
    
    fill(255, 45, 120, 100);
    ellipse(cx, cy, s * 2);
  }
}

function windowResized() {
  resizeCanvas(windowWidth, windowHeight);
  // Reposition cats
  if (cats.length >= 5) {
    cats[0].x = width * 0.18; cats[0].y = height * 0.58;
    cats[1].x = width * 0.5;  cats[1].y = height * 0.55;
    cats[2].x = width * 0.82; cats[2].y = height * 0.58;
    cats[3].x = width * 0.35; cats[3].y = height * 0.7;
    cats[4].x = width * 0.65; cats[4].y = height * 0.72;
  }
}

// Keyboard shortcuts
function keyPressed() {
  if (key === 's' || key === 'S') saveCanvas('mia-birthday', 'png');
  if (key === 'r' || key === 'R') {
    // Restart animation
    scene = 0;
    sceneTimer = 0;
    t = 0;
  }
}
</script>
</body>
</html>
